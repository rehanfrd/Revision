name: Build Flutter APK

# Yeh bata raha hai ki trigger kab hona hai
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Isse aap manually bhi ek button click se trigger kar payenge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Book-Revision-App
          path: build/app/outputs/flutter-apk/app-release.apk
